# Ambiente local/producao simples. Uso: cp .env.example .env (preencher) && docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestao
      POSTGRES_USER: gestao
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestao -d gestao"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: ${JAVA_OPTS:--Xmx384m}
      DB_URL: jdbc:postgresql://db:5432/gestao
      DB_USER: gestao
      DB_PASSWORD: ${DB_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      BOOTSTRAP_SOCIA_NOME: ${BOOTSTRAP_SOCIA_NOME:-}
      BOOTSTRAP_SOCIA_EMAIL: ${BOOTSTRAP_SOCIA_EMAIL:-}
      BOOTSTRAP_SOCIA_SENHA: ${BOOTSTRAP_SOCIA_SENHA:-}
      # Anexos e modelos de pecas: volume proprio (entra no backup)
      STORAGE_DIR: /data/storage
      # Rotinas diarias: desligadas ate o e-mail e as OABs estarem configurados
      APP_CAPTURA_AGENDADA: ${APP_CAPTURA_AGENDADA:-false}
      APP_ALERTAS_AGENDADO: ${APP_ALERTAS_AGENDADO:-false}
      APP_ESCRITORIO_ENDERECO: ${APP_ESCRITORIO_ENDERECO:-}
      APP_ESCRITORIO_CONTATO: ${APP_ESCRITORIO_CONTATO:-}
    volumes:
      - storage:/data/storage

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["https"]
    depends_on:
      - web
    environment:
      DOMINIO: ${DOMINIO:-localhost}
      DOMINIO_APEX: ${DOMINIO_APEX:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:80"

volumes:
  dbdata:
  storage:
  caddydata:
