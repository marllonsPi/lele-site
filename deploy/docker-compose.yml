# Ambiente local/producao simples. Uso: cp .env.example .env (preencher) && docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestao
      POSTGRES_USER: gestao
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestao -d gestao"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # IPv4 na JVM: a VM nao tem saida IPv6 e o Google resolve primeiro por IPv6 (connect timed out)
      JAVA_TOOL_OPTIONS: ${JAVA_OPTS:--Xmx384m} -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv4Addresses=true
      DB_URL: jdbc:postgresql://db:5432/gestao
      DB_USER: gestao
      DB_PASSWORD: ${DB_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      BOOTSTRAP_SOCIA_NOME: ${BOOTSTRAP_SOCIA_NOME:-}
      BOOTSTRAP_SOCIA_EMAIL: ${BOOTSTRAP_SOCIA_EMAIL:-}
      BOOTSTRAP_SOCIA_SENHA: ${BOOTSTRAP_SOCIA_SENHA:-}
      BOOTSTRAP_MESTRE_NOME: ${BOOTSTRAP_MESTRE_NOME:-}
      BOOTSTRAP_MESTRE_EMAIL: ${BOOTSTRAP_MESTRE_EMAIL:-}
      BOOTSTRAP_MESTRE_SENHA: ${BOOTSTRAP_MESTRE_SENHA:-}
      # Anexos e modelos de pecas: volume proprio (entra no backup)
      STORAGE_DIR: /data/storage
      # Rotinas diarias: desligadas ate o e-mail e as OABs estarem configurados
      APP_CAPTURA_AGENDADA: ${APP_CAPTURA_AGENDADA:-false}
      APP_ALERTAS_AGENDADO: ${APP_ALERTAS_AGENDADO:-false}
      APP_ESCRITORIO_ENDERECO: ${APP_ESCRITORIO_ENDERECO:-}
      APP_ESCRITORIO_CONTATO: ${APP_ESCRITORIO_CONTATO:-}
      # Conexao Google (Gmail e Drive): desligada enquanto faltar algum destes (docs/13 e docs/14)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_TOKEN_KEY: ${GOOGLE_TOKEN_KEY:-}
      IMPORTACAO_PASTA_CLIENTES_ID: ${IMPORTACAO_PASTA_CLIENTES_ID:-}
      IMPORTACAO_PLANILHA_ID: ${IMPORTACAO_PLANILHA_ID:-}
    volumes:
      - storage:/data/storage

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["https"]
    depends_on:
      - web
    environment:
      DOMINIO: ${DOMINIO:-localhost}
      DOMINIO_APEX: ${DOMINIO_APEX:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:80"

volumes:
  dbdata:
  storage:
  caddydata:
