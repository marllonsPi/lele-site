# Mantem o esquema original quando ha um proxy TLS na frente (Caddy na VM).
map $http_x_forwarded_proto $esquema {
    default $scheme;
    https   https;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Site institucional (usa Google Fonts e agenda externa): sem CSP restritiva.
    location / {
        try_files $uri $uri/ =404;
    }

    # Sistema de gestao: CSP estrita.
    location /app/ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
        try_files $uri /app/index.html;
    }

    location /api/ {
        # anexos de ate 20 MB e leituras longas do Drive (importacao de suporte): limites do nginx padrao (1 MB / 60 s) eram curtos
        client_max_body_size 25m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $esquema;
    }

    location /actuator/health {
        proxy_pass http://backend:8080;
    }
}
