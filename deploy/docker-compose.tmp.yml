# Stack TEMPORARIA de teste (Fase D2), projeto `crispimtmp`: banco proprio, sem portas publicadas, dados ficticios.
# Usa a imagem do backend de producao ja construida (sem build). Remover no fim:
#   docker compose -p crispimtmp -f docker-compose.tmp.yml down -v    (o -v vale SO para este projeto descartavel)
services:
  db:
    image: postgres:16-alpine
    mem_limit: 160m
    environment:
      POSTGRES_DB: gestao
      POSTGRES_USER: gestao
      POSTGRES_PASSWORD: ${TMP_DB_PASSWORD:?}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestao -d gestao"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    image: crispim-backend:latest
    pull_policy: never
    mem_limit: 340m
    depends_on:
      db:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: -Xmx192m
      DB_URL: jdbc:postgresql://db:5432/gestao
      DB_USER: gestao
      DB_PASSWORD: ${TMP_DB_PASSWORD:?}
      COOKIE_SECURE: "false"
      STORAGE_DIR: /data/storage
      BOOTSTRAP_SOCIA_NOME: Socia Ficticia
      BOOTSTRAP_SOCIA_EMAIL: socia@teste.invalid
      BOOTSTRAP_SOCIA_SENHA: ${TMP_SOCIA_SENHA:?}
    volumes:
      - storage:/data/storage
volumes:
  storage:
