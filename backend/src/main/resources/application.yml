spring:
  application:
    name: gestao
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gestao}
    username: ${DB_USER:gestao}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  jackson:
    default-property-inclusion: non_null
    deserialization:
      # Jackson 3 recusa `null` em campo primitivo; para a API, booleano ausente significa false.
      fail-on-null-for-primitives: false

server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:true}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# Primeira socia, criada somente se nao houver nenhum usuario e as tres variaveis existirem.
app:
  bootstrap:
    socia:
      nome: ${BOOTSTRAP_SOCIA_NOME:}
      email: ${BOOTSTRAP_SOCIA_EMAIL:}
      senha: ${BOOTSTRAP_SOCIA_SENHA:}
    # Acesso mestre: criado (ou promovido, se o e-mail ja existir) a cada partida. Pode sair do ambiente depois.
    mestre:
      nome: ${BOOTSTRAP_MESTRE_NOME:}
      email: ${BOOTSTRAP_MESTRE_EMAIL:}
      senha: ${BOOTSTRAP_MESTRE_SENHA:}

# Pasta dos anexos (fora de qualquer pasta publica; deve ser volume persistente e entrar no backup).
app.storage.dir: ${STORAGE_DIR:./storage}

# Conexao OAuth 2.0 com a conta Google de cada pessoa (captura de intimacoes por e-mail). Desligada se algum faltar.
# GOOGLE_TOKEN_KEY: 32 bytes em base64 (openssl rand -base64 32), fora do banco e do Git.
app.google:
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}
  redirect-uri: ${GOOGLE_REDIRECT_URI:}
  token-key: ${GOOGLE_TOKEN_KEY:}
  gmail.query: ${GOOGLE_GMAIL_QUERY:from:jus.br}

# Importacao da planilha financeira e das pastas de clientes do Google Drive (somente leitura; exige conta Google conectada com acesso ao Drive).
app.importacao:
  pasta-clientes-id: ${IMPORTACAO_PASTA_CLIENTES_ID:}
  planilha-id: ${IMPORTACAO_PLANILHA_ID:}
  sincronizacao-diaria: ${IMPORTACAO_SINCRONIZACAO_DIARIA:false}
  conta-usuario-id: ${IMPORTACAO_CONTA_USUARIO_ID:0}
